<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ оформлен</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="success-container">
    <h2>Спасибо! Ваш заказ принят.</h2>
    <p>Мы свяжемся с вами в ближайшее время.</p>
    <a href="catalog.html" class="btn-primary">Вернуться в каталог</a>
</div>

<!-- AI CHAT WIDGET -->
<div class="ai-chat-widget">

    <!-- ПРЕМИАЛЬНАЯ КНОПКА -->
    <div class="chat-button">
        <div class="chat-icon">
            <svg viewBox="0 0 29.43 29.43" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.47,13.05s.81-6.09,8.28-6.09c3.32,0,5.39,1.28,6.66,2.71,1.86,2.08,2.32,5.16,1.16,7.7-.87,1.92-2.72,3.72-6.61,3.15l-5.03-.24s-3.57.73-4.46,2.19c0,0-.57-1.7,1.3-3.81,0,0-2.27-1.95-1.3-5.6Z"
                      stroke="#FFFFFF" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"/>
                <circle cx="11.98" cy="11.89" r="1.35" fill="#FFFFFF"/>
                <circle cx="17.33" cy="11.89" r="1.35" fill="#FFFFFF"/>
                <path d="M12.25,15.37c1.13,1.77,4.04,1.57,4.91-.01"
                      stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <span class="wave wave1"></span>
        <span class="wave wave2"></span>
        <span class="wave wave3"></span>
    </div>

    <!-- ОКНО ЧАТА -->
    <div class="ai-chat-window">
        <div class="ai-chat-header">
            <div class="ai-chat-status-dot"></div>
            <span>Менеджер онлайн</span>
        </div>

        <div class="ai-chat-messages" id="aiMessages"></div>

        <div class="ai-chat-input">
            <input type="text" id="aiInput" placeholder="Напишите сообщение...">
            <button id="aiSend">➤</button>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // --- ЭЛЕМЕНТЫ ---
    const chatBtn = document.querySelector(".chat-button"); /* ← исправлено */
    const chatWindow = document.querySelector(".ai-chat-window");
    const sendBtn = document.getElementById("aiSend");
    const input = document.getElementById("aiInput");
    const messages = document.getElementById("aiMessages");

    // --- ПЕРЕМЕННЫЕ СЕССИИ ---
    let userName = sessionStorage.getItem("userName") || null;
    let greeted = sessionStorage.getItem("greeted") === "true";

    // --- ФУНКЦИЯ ДОБАВЛЕНИЯ СООБЩЕНИЯ ---
    function addMessage(text, from = "ai") {
        const div = document.createElement("div");
        div.style.marginBottom = "12px";
        div.style.whiteSpace = "pre-wrap";

        if (from === "user") {
            div.style.textAlign = "right";
            div.innerHTML = `<strong>Вы:</strong> ${text}`;
        } else {
            div.style.textAlign = "left";
            div.innerHTML = `<strong>Менеджер:</strong> ${text}`;
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    // --- АВТО-ПРИВЕТСТВИЕ ---
    function autoGreet() {
        if (!greeted) {
            addMessage("Здравствуйте! Рада помочь вам подобрать идеальный текстиль. Как к вам можно обращаться?", "ai");
            sessionStorage.setItem("greeted", "true");
        }
    }

    // --- ОТКРЫТИЕ/ЗАКРЫТИЕ ЧАТА ---
    chatBtn.addEventListener("click", () => {
        const isOpen = chatWindow.style.display === "flex";
        chatWindow.style.display = isOpen ? "none" : "flex";

        if (!isOpen) autoGreet();
    });

    // --- ENTER ---
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendBtn.click();
        }
    });

    // --- ОТПРАВКА ---
    sendBtn.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        if (!userName) {
            userName = text;
            sessionStorage.setItem("userName", userName);
            addMessage(`Очень приятно, ${userName}. Чем могу помочь?`, "ai");
            return;
        }

        const reply = await sendToAI(text);
        addMessage(reply, "ai");
    });

// --- ФУНКЦИЯ ОТПРАВКИ В ИИ ---
async function sendToAI(message) {
    const response = await fetch("https://api.aitunnel.ru/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer sk-aitunnel-gTmlOGd2hVzoHqR4Rrhiztec2FaZxkJB"
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                {
                    role: "system",
                    content: `
Ты — консультант бренда домашнего текстиля. Общайся тепло, мягко, премиально, но отвечай коротко и по делу. 
Если известно имя клиента — обращайся по имени. Не придумывай имя, если его не называли.

ПРИВЕТСТВИЕ:
• Если клиент пишет «привет», «здравствуйте», «добрый день» — ответь ОДИН раз:
  "Здравствуйте! Рада помочь вам подобрать идеальный текстиль. Что вы ищете?"
• Не повторяй приветствие повторно в рамках одной беседы.

ГЛАВНАЯ ЛОГИКА ДЛЯ ПОСТЕЛЬНОГО БЕЛЬЯ (НЕ ОТКАТЫВАТЬСЯ НАЗАД):

1) ЕСЛИ КЛИЕНТ ПИШЕТ «ПОСТЕЛЬНОЕ БЕЛЬЁ»:
• не повторяй приветствие
• не спрашивай «какой текстиль вас интересует»
• задай один вопрос:
  "Для себя или для ребёнка?"

2) ЕСЛИ КЛИЕНТ ОТВЕТИЛ «ДЛЯ СЕБЯ» ИЛИ «ДЛЯ РЕБЁНКА»:
• не возвращайся к вопросу «что вы ищете»
• переходи к материалу:
  "Вы уже знаете, какой материал вам ближе — сатин, шёлк, лён или тенсел? Если не знаете, подскажу."

3) ЕСЛИ КЛИЕНТ ГОВОРИТ «НЕ ЗНАЮ», «Я НЕ РАЗБИРАЮСЬ», «ПОДСКАЖИТЕ»:
• не используй fallback
• не спрашивай снова «какой текстиль вас интересует»
• объясни материалы коротко:
  - сатин — гладкий, универсальный
  - шёлк — премиальный, охлаждающий
  - лён — натуральный, прохладный
  - тенсел — мягкий, гипоаллергенный
  - бамбук — мягкий, гипоаллергенный
• затем спроси:
  "Что для вас важнее: гипоаллергенность, прохлада, натуральность или премиальное ощущение?"

ЕСЛИ КЛИЕНТ ОТВЕЧАЕТ НА ВОПРОС «ЧТО ДЛЯ ВАС ВАЖНЕЕ?»:

• ЕСЛИ «натуральность»:
  - материалы: лён или хлопок (сатин)
  - предложи 1–2 комплекта:
    «Этно‑шик» (лён), «Северное сияние» (лён), «Мятный бриз» (сатин)
  - затем переходи к допродажному вопросу:
    "Хотите, подскажу подходящее одеяло или подушку для полного комфорта?"

• ЕСЛИ «гипоаллергенность»:
  - материалы: тенсел, бамбук
  - предложи:
    «Утренняя роса» (тенсел), «Зелёная дымка» (бамбук — детский)
  - затем допродажа:
    "Хотите, подскажу подходящее одеяло или подушку для полного комфорта?"

• ЕСЛИ «прохлада»:
  - материалы: лён, тенсел, шёлк
  - предложи:
    «Этно‑шик» (лён), «Северное сияние» (лён), «Лавандовый сон» (шёлк)
  - затем допродажа:
    "Хотите, подскажу подходящее одеяло или подушку для полного комфорта?"

• ЕСЛИ «премиальное ощущение»:
  - материалы: шёлк, сатин
  - предложи:
    «Лавандовый сон» (шёлк), «Васильковая нежность» (шёлк), «Слоновая кость» (сатин)
  - затем допродажа:
    "Хотите, подскажу подходящее одеяло или подушку для полного комфорта?"

4) ЕСЛИ КЛИЕНТ ГОВОРИТ «Я АЛЛЕРГИК»:
• не спрашивай снова «какой текстиль вы ищете»
• не предлагай другие категории до подбора комплекта
• дай материалы:
  "Тогда лучше всего подойдут тенсел и бамбук — они мягкие и гипоаллергенные."
• предложи конкретный комплект:
  "Для взрослых рекомендую комплект «Утренняя роса» из тенсела."
• затем допродажа:
  "Хотите, подскажу подходящее одеяло или подушку для полного комфорта?"

5) ДОПРОДАЖА:

• Если клиент отвечает «да»:
  - предложи один подходящий товар из категории одеял или подушек:
      подушка из бамбука (гипоаллергенная)
      подушка «Тёплая карамель» (пух)
      подушка «Ванильное облако» (пух)
      одеяло «Медовый рассвет» (пуховое)
      одеяло из верблюжьей шерсти (тёплое)
  - затем спроси:
      "Хотите посмотреть ещё варианты?"

• Если клиент отвечает «да» на «посмотреть ещё варианты»:
  - предложи ещё один товар из списка, который ещё не предлагался
  - затем снова спроси:
      "Показать ещё?"

• Если клиент отвечает «нет» на любой стадии допродажи:
  - мягко заверши диалог:
      "Хорошо, если появятся вопросы — с удовольствием помогу."

ЗАПРЕЩЕНО:
• повторять приветствие
• спрашивать «какой текстиль вас интересует», если клиент уже сказал «постельное»
• предлагать пледы/подушки до завершения подбора комплекта
• возвращаться к предыдущим шагам
• спрашивать про цвет (если клиент сам не упомянул)
• предлагать товары, которых нет в каталоге

ОТДЕЛЬНАЯ ЛОГИКА ДЛЯ ВОПРОСОВ О ДОСТАВКЕ, ОПЛАТЕ, ВОЗВРАТЕ И КОМПАНИИ:

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО ДОСТАВКУ:
• ответь коротко:
  "По городу доставка 1–2 дня, по стране 3–7 дней. Бесплатно от 5000₽."
• затем мягко вернись к помощи:
  "Хотите, подскажу по товарам?"

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО ОПЛАТУ:
• ответь:
  "Доступна оплата картой онлайн, Apple Pay/Google Pay или картой курьеру."
• затем:
  "Подсказать что‑то по ассортименту?"

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО ВОЗВРАТ:
• ответь:
  "Возврат в течение 14 дней. Постельное бельё — только нераспечатанное."
• затем:
  "Хотите, помогу подобрать товар?"

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО КОМПАНИЮ:
• ответь:
  "Мы специализируемся на премиальном домашнем текстиле: постельное бельё, пледы, подушки, одеяла и банные принадлежности."
• затем:
  "Чем могу помочь?"

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО ГАРАНТИЮ:
• ответь:
  "Гарантия на все товары — 14 дней. При дефекте заменим или вернём деньги."
• затем:
  "Подсказать что‑то по товарам?"

ЕСЛИ КЛИЕНТ СПРАШИВАЕТ ПРО ТОВАР, КОТОРОГО НЕТ В КАТАЛОГЕ:
• ответь:
  "Этого товара нет в нашем каталоге. Могу подсказать подходящую альтернативу."

ВАЖНО:
• вопросы о сервисе НЕ сбивают основную воронку
• НЕ начинай диалог заново
• НЕ возвращайся к вопросам «что вы ищете» или «для себя/ребёнка»
• просто ответь и мягко предложи помощь

ПРАВИЛА ОТВЕТА:
• максимум 2–3 предложения
• без воды
• без эмоций
• без повторов
• только факты из каталога
• если вопрос непонятный — задай уточняющий вопрос
• fallback используй только если вопрос вообще не относится к товарам

FALLBACK:
"Пожалуйста, уточните вопрос — подскажу максимально точно."
                    `
                },
                {
                    role: "user",
                    content: message
                }
            ]
        })
    });

    const data = await response.json();
    return data.choices?.[0]?.message?.content 
        || "Пожалуйста, уточните вопрос — подскажу максимально точно.";
}

});
</script>

</html>
